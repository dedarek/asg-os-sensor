# ASG Analyst LLM providers (OpenAI-compatible). No secrets here.
# Secrets come from environment variables or .env (see .env.example).
default_route: custom-openai
routes:
  custom-openai:
    provider: openai
    model: qwen38-27b
    base_url: https://aicloud-app.lenovo.com.cn/qwen38-27b/v1
    key_env: ASG_ANALYST_API_KEY
    chat_path: /chat/completions
    responses_path: /responses
    extra_headers: {}
    timeout_s: 30
    # Confirmed by this gateway's context-length error; set independently per model.
    context_limit: 32768
    max_output_tokens: 4096
    # Retain recent complete tool pairs; archived observations remain retrievable.
    # This bounds request context, not total investigation duration or tool count.
    tool_context_window: 4
    # This selected endpoint currently presents an expired certificate.  The
    # exception is route-scoped and uses the process-local loopback proxy.
    # Other routes default to certificate verification.
    tls:
      verify: false
      transport: loopback-proxy
